<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Báo Giá Dịch Vụ - Content & Social Media</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        primary: '#2563eb',     // Blue for back of cards and highlights
                        'primary-light': '#eff6ff',
                        vocab: '#f59e0b',       // Yellow/Orange for front of cards
                        'vocab-light': '#fffbeb',
                        dark: '#1e293b',
                    },
                    boxShadow: {
                        'floating': '0 10px 40px -10px rgba(0,0,0,0.08)',
                        'premium': '0 20px 25px -5px rgba(37, 99, 235, 0.1), 0 8px 10px -6px rgba(37, 99, 235, 0.1)',
                    }
                }
            }
        }
    </script>

    <style>
        /* CSS Utilities for 3D Flip Effects */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-x-180 {
            transform: rotateX(180deg);
        }
        
        /* Smooth scrolling */
        html { scroll-behavior: smooth; }
        
        /* Custom scrollbar for inner card content */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }
    
        /* Lead modal */
        .lead-modal-backdrop { background: rgba(15, 23, 42, .62); backdrop-filter: blur(10px); }
        .lead-modal { animation: leadModalIn .22s ease-out; }
        @keyframes leadModalIn { from { opacity:0; transform:translateY(12px) scale(.98); } to { opacity:1; transform:translateY(0) scale(1); } }
        body.modal-open { overflow: hidden; }
</style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen selection:bg-primary selection:text-white">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Data Models
        const platformsData = {
            facebook_instagram: {
                eyebrow: "01 / SOCIAL CONTENT",
                title: "FACEBOOK & INSTAGRAM",
                subtitle: "POST + SHORT VIDEO",
                icon: (
                    <div className="flex items-center gap-2">
                        <div className="w-11 h-11 rounded-2xl bg-blue-50 flex items-center justify-center">
                            <svg className="w-7 h-7 text-blue-600" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z" />
                            </svg>

                        <div className="w-11 h-11 rounded-2xl bg-pink-50 flex items-center justify-center">
                            <svg className="w-7 h-7 text-pink-500" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                                <rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor" stroke="none"/>
                            </svg>
                        </div>
                    </div>
                ),
                packages: [
                    { name: "Basic", content: "20 bài post + 2 video", price: "2.599.000đ/tháng" },
                    { name: "Standard", content: "23 bài post + 4 video", price: "2.999.000đ/tháng", popular: true },
                    { name: "Premium", content: "25 bài post + 7 video + tặng 1 video", price: "3.699.000đ/tháng" }
                ]
            },
            youtube_tiktok: {
                eyebrow: "02 / SHORT VIDEO",
                title: "YOUTUBE & TIKTOK",
                subtitle: "SHORT VIDEO",
                icon: (
                    <div className="flex items-center gap-2">
                        <div className="w-11 h-11 rounded-2xl bg-red-50 flex items-center justify-center">
                            <svg className="w-7 h-7 text-red-600" fill="currentColor" viewBox="0 0 24 24"><path d="M21.58 6.19a2.99 2.99 0 0 0-2.12-2.12C17.6 3.5 12 3.5 12 3.5s-5.6 0-7.46.57a2.99 2.99 0 0 0-2.12 2.12C1.85 8.05 1.85 12 1.85 12s0 3.95.57 5.81c.24.86.92 1.54 1.78 1.78 1.86.57 7.46.57 7.46.57s5.6 0 7.46-.57a2.99 2.99 0 0 0 2.12-2.12c.57-1.86.57-5.81.57-5.81s0-3.95-.23-5.81ZM9.9 15.5v-7l6 3.5-6 3.5Z"/></svg>
                        </div>
                        <div className="w-11 h-11 rounded-2xl bg-slate-100 flex items-center justify-center">
                            <svg className="w-7 h-7 text-slate-900" fill="currentColor" viewBox="0 0 24 24"><path d="M12.5.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93v7.2c0 1.96-.45 3.95-1.7 5.43-1.4 1.65-3.5 2.65-5.69 2.58-2.67-.09-5.18-1.71-6.1-4.22-.88-2.39-.23-5.23 1.66-6.93 1.74-1.57 4.26-2.05 6.45-1.29v4.22c-.93-.24-1.99-.07-2.73.57-.75.64-1.07 1.68-.84 2.63.26 1.05 1.25 1.83 2.33 1.92 1.34.1 2.63-.74 3.01-2.02.26-.88.24-1.82.24-2.73V.02H12.5Z"/></svg>
                        </div>
                    </div>
                ),
                packages: [
                    { name: "Basic", content: "20 video/tháng", price: "3.499.000đ/tháng" },
                    { name: "Standard", content: "25 video/tháng", price: "3.999.000đ/tháng", popular: true },
                    { name: "Premium", content: "30 video + tặng 2 video", price: "4.699.000đ/tháng" }
                ]
            },
            website: {
                eyebrow: "03 / WEBSITE",
                title: "WEBSITE SEO CONTENT",
                subtitle: "SEO ARTICLE + ON-PAGE OPTIMIZATION",
                icon: (
                    <div className="w-11 h-11 rounded-2xl bg-violet-50 flex items-center justify-center">
                        <svg className="w-7 h-7 text-violet-600" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24">
                            <rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 6.5h.01M11 6.5h.01M14 6.5h.01"/><path d="M7 13h3M7 16h6M14 13h4"/>
                        </svg>
                    </div>
                ),
                packages: [
                    { name: "Basic", content: "20 bài SEO/tháng", price: "2.499.000đ/tháng" },
                    { name: "Standard", content: "25 bài SEO/tháng", price: "2.999.000đ/tháng", popular: true },
                    { name: "Premium", content: "30 bài SEO/tháng", price: "3.299.000đ/tháng" }
                ]
            }
        };

        const scopeOfWorkData = [
            { id: "01", title: "Content Planning", items: ["Nghiên cứu lĩnh vực và đối tượng khách hàng", "Xây dựng content pillars", "Lên content plan theo tuần/tháng", "Phân bổ chủ đề và định dạng nội dung", "Lập lịch đăng bài/video"] },
            { id: "02", title: "Content Creation", items: ["Nghiên cứu chủ đề", "Viết nội dung & caption", "Xây dựng concept", "Viết hook cho short video", "Xây dựng outline/kịch bản video"] },
            { id: "03", title: "Social Media Management", items: ["Quản lý Fanpage/kênh nội dung", "Đăng tải nội dung theo kế hoạch", "Tối ưu caption, hashtag, tiêu đề", "Theo dõi hiệu quả nội dung", "Đề xuất điều chỉnh nội dung"] },
            { id: "04", title: "SEO Content", items: ["Nghiên cứu chủ đề & search intent", "Xây dựng outline bài viết SEO", "Tối ưu keyword, heading, meta", "Viết & tối ưu nội dung trên website", "Đề xuất điều chỉnh nội dung theo mục tiêu SEO"] }
        ];

        const Header = () => (
            <header className="relative pt-16 md:pt-20 pb-14 text-center overflow-hidden">
                <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[400px] bg-primary/10 rounded-full blur-[100px] -z-10"></div>
                <div className="absolute bottom-0 left-1/4 w-[400px] h-[300px] bg-vocab/10 rounded-full blur-[80px] -z-10"></div>
                
                <div className="max-w-4xl mx-auto px-6">
                    <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white border border-slate-200 text-sm font-bold text-primary mb-6 shadow-sm">
                        <span className="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
                        Bảng Báo Giá Dịch Vụ
                    </div>
                    <h1 className="text-4xl md:text-5xl lg:text-6xl font-extrabold text-dark tracking-tight mb-6 leading-tight">
                        Remote Content &<br/> <span className="text-transparent bg-clip-text bg-gradient-to-r from-primary via-violet-500 to-pink-500">Social Media</span>
                    </h1>
                    <p className="text-xl text-slate-500 mb-8 font-semibold">
                        Đoàn Quốc Anh <span className="text-slate-300">·</span> Content & Social Media
                    </p>
                    
                    <div className="flex flex-wrap justify-center gap-4 text-sm font-medium">
                        <div className="px-5 py-3 bg-white/80 backdrop-blur-md rounded-2xl border border-slate-200 shadow-sm flex items-center gap-2">
                            <span className="w-2 h-2 rounded-full bg-green-500"></span>
                            Lĩnh vực: Đa ngành
                        </div>
                        <div className="px-5 py-3 bg-white/80 backdrop-blur-md rounded-2xl border border-slate-200 shadow-sm flex items-center gap-2">
                            <span className="w-2 h-2 rounded-full bg-vocab"></span>
                            Kinh nghiệm: 2 năm Social Media Marketing
                        </div>
                        <div className="px-5 py-3 bg-white/80 backdrop-blur-md rounded-2xl border border-slate-200 shadow-sm flex items-center gap-2">
                            <span className="w-2 h-2 rounded-full bg-primary"></span>
                            Hình thức: Remote
                        </div>
                    </div>
                </div>
            </header>
        );

        const PricingCard = ({ pkg, platformTitle }) => (
            <div className={`relative bg-white/85 backdrop-blur-xl rounded-[2rem] p-7 md:p-8 border ${pkg.popular ? 'border-primary/70 shadow-premium ring-4 ring-primary/5' : 'border-slate-200/80 shadow-floating'} flex flex-col h-full transition-all duration-300 hover:-translate-y-2 hover:shadow-premium`}>
                {pkg.popular && (
                    <div className="absolute -top-4 left-1/2 -translate-x-1/2 bg-primary text-white text-xs font-bold uppercase tracking-wider py-1.5 px-4 rounded-full shadow-lg">
                        Phổ biến nhất
                    </div>
                )}
                <div className="flex items-center justify-between gap-3 mb-2">
                    <h3 className="text-xl font-extrabold text-dark">{pkg.name}</h3>
                    <span className="text-[10px] font-extrabold uppercase tracking-widest px-2.5 py-1 rounded-full bg-slate-100 text-slate-400">/ month</span>
                </div>
                <div className="text-3xl md:text-[2.1rem] font-extrabold text-primary mb-6 tracking-tight">
                    {pkg.price.split('/')[0]} <span className="text-base font-medium text-slate-400">/{pkg.price.split('/')[1] || 'tháng'}</span>
                </div>
                <div className="h-px w-full bg-slate-100 mb-6"></div>
                <ul className="space-y-4 mb-8 flex-grow">
                    <li className="flex items-start gap-3 text-slate-600">
                        <svg className="w-5 h-5 text-green-500 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                        <span className="font-semibold text-dark">{pkg.content}</span>
                    </li>
                    <li className="flex items-start gap-3 text-slate-500">
                        <svg className="w-5 h-5 text-primary/50 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                        <span>Triển khai nội dung theo kế hoạch</span>
                    </li>
                    <li className="flex items-start gap-3 text-slate-500">
                        <svg className="w-5 h-5 text-primary/50 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                        <span>Lên kế hoạch & tối ưu nội dung</span>
                    </li>
                </ul>
                <button type="button" onClick={() => window.dispatchEvent(new CustomEvent('openLeadModal', { detail: { platform: platformTitle, packageName: pkg.name, price: pkg.price, content: pkg.content } }))} className={`w-full py-4 rounded-2xl font-bold transition-all ${pkg.popular ? 'bg-primary text-white hover:bg-blue-700 shadow-md shadow-primary/20' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>
                    Chọn gói này
                </button>
            </div>
        );

        const PricingSection = ({ data }) => (
            <section className="py-12 md:py-16 px-6 max-w-7xl mx-auto">
                <div className="flex flex-col md:flex-row md:items-end gap-5 mb-10">
                    {data.icon}
                    <div className="text-center md:text-left">
                        <div className="text-xs font-extrabold tracking-[0.2em] text-primary uppercase mb-2">{data.eyebrow}</div>
                        <h2 className="text-2xl md:text-3xl font-extrabold text-dark uppercase tracking-tight">{data.title}</h2>
                        <p className="text-sm font-semibold text-slate-400 mt-1 tracking-wide">{data.subtitle}</p>
                    </div>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-7">
                    {data.packages.map((pkg, index) => <PricingCard key={index} pkg={pkg} platformTitle={data.title} />)}
                </div>
                <div className="mt-7 flex flex-col sm:flex-row items-center justify-between gap-3 px-5 py-4 rounded-2xl bg-slate-900 text-white">
                    <span className="text-sm font-medium text-slate-300">Cần số lượng / hạng mục riêng?</span>
                    <span className="text-sm font-extrabold text-white">Nhắn tin để trao đổi trực tiếp →</span>
                </div>
            </section>
        );

        const InteractiveVocab = ({ item }) => {
            const [isFlipped, setIsFlipped] = useState(false);

            return (
                <div 
                    className="perspective-1000 w-full h-[320px] cursor-pointer group" 
                    onClick={() => setIsFlipped(!isFlipped)}
                >
                    <div className={`relative w-full h-full transition-transform duration-700 transform-style-3d ${isFlipped ? 'rotate-x-180' : ''}`}>
                        
                        {/* Mặt trước: Màu Vàng (Vocab) */}
                        <div className="absolute inset-0 backface-hidden bg-gradient-to-br from-vocab to-orange-500 text-white rounded-3xl p-8 flex flex-col items-center justify-center shadow-floating border border-orange-300">
                            <span className="text-6xl font-black opacity-20 absolute top-4 right-6">{item.id}</span>
                            <div className="w-16 h-16 bg-white/20 backdrop-blur-sm rounded-2xl flex items-center justify-center mb-6 shadow-inner">
                                <svg className="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                            </div>
                            <h3 className="text-2xl font-extrabold text-center drop-shadow-md">{item.title}</h3>
                            <p className="mt-4 text-orange-100 font-medium text-sm text-center flex items-center gap-2">
                                Click để xem chi tiết
                                <svg className="w-4 h-4 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                            </p>
                        </div>
                        
                        {/* Mặt sau: Màu Xanh (Primary) */}
                        <div className="absolute inset-0 backface-hidden bg-gradient-to-br from-primary to-blue-700 text-white rounded-3xl p-8 shadow-premium rotate-x-180 border border-blue-400 flex flex-col justify-center">
                            <h4 className="text-xl font-bold mb-4 border-b border-blue-400/50 pb-2">{item.id}. {item.title}</h4>
                            <ul className="space-y-3 custom-scrollbar overflow-y-auto pr-2">
                                {item.items.map((desc, idx) => (
                                    <li key={idx} className="flex items-start gap-3 text-blue-50 text-sm md:text-base">
                                        <div className="w-1.5 h-1.5 rounded-full bg-white mt-2 shrink-0"></div>
                                        <span>{desc}</span>
                                    </li>
                                ))}
                            </ul>
                        </div>
                    </div>
                </div>
            );
        };

        const ScopeOfWork = () => (
            <section className="py-20 px-6 bg-white/40 backdrop-blur-sm border-t border-b border-slate-200 mt-10">
                <div className="max-w-7xl mx-auto">
                    <div className="text-center mb-16">
                        <h2 className="text-3xl md:text-4xl font-extrabold text-dark mb-4">Phạm vi công việc</h2>
                        <p className="text-slate-500 max-w-2xl mx-auto text-lg">Chi tiết các hạng mục được triển khai trong quá trình quản lý và phát triển nội dung đa nền tảng.</p>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6">
                        {scopeOfWorkData.map((item, index) => (
                            <InteractiveVocab key={index} item={item} />
                        ))}
                    </div>
                </div>
            </section>
        );

        const FORM_ENDPOINT = "PASTE_YOUR_WEBHOOK_URL_HERE";

        const LeadModal = () => {
            const [open, setOpen] = useState(false);
            const [selected, setSelected] = useState({ platform: "", packageName: "", price: "", content: "" });
            const [submitted, setSubmitted] = useState(false);
            const [submitting, setSubmitting] = useState(false);
            const [error, setError] = useState("");

            useEffect(() => {
                const handler = (event) => {
                    setSelected(event.detail || {});
                    setSubmitted(false);
                    setError("");
                    setOpen(true);
                };
                window.addEventListener("openLeadModal", handler);
                return () => window.removeEventListener("openLeadModal", handler);
            }, []);

            useEffect(() => {
                document.body.classList.toggle("modal-open", open);
                const onKeyDown = (e) => { if (e.key === "Escape" && !submitting) setOpen(false); };
                if (open) document.addEventListener("keydown", onKeyDown);
                return () => document.removeEventListener("keydown", onKeyDown);
            }, [open, submitting]);

            if (!open) return null;

            const close = () => { if (!submitting) setOpen(false); };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError("");
                if (!FORM_ENDPOINT || FORM_ENDPOINT.includes("PASTE_YOUR")) {
                    setError("Chưa cấu hình Webhook. Mày dán URL webhook vào biến FORM_ENDPOINT trong file HTML trước nhé.");
                    return;
                }
                setSubmitting(true);
                const form = new FormData(e.currentTarget);
                const payload = {
                    timestamp: new Date().toISOString(),
                    fullName: form.get("fullName"),
                    company: form.get("company"),
                    phone: form.get("phone"),
                    email: form.get("email"),
                    platform: selected.platform,
                    packageName: selected.packageName,
                    price: selected.price,
                    packageContent: selected.content,
                    source: window.location.href
                };
                try {
                    const body = new URLSearchParams(payload);
                    await fetch(FORM_ENDPOINT, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
                        body
                    });
                    setSubmitted(true);
                } catch (err) {
                    setError("Gửi thông tin chưa thành công. Kiểm tra lại Webhook URL hoặc cấu hình nhận dữ liệu rồi thử lại.");
                } finally {
                    setSubmitting(false);
                }
            };

            return (
                <div className="fixed inset-0 z-[9999] lead-modal-backdrop flex items-center justify-center p-4" onMouseDown={(e) => { if (e.target === e.currentTarget) close(); }}>
                    <div className="lead-modal w-full max-w-lg bg-white rounded-[2rem] shadow-2xl overflow-hidden">
                        {!submitted ? (
                            <>
                                <div className="px-7 pt-7 pb-5 border-b border-slate-100 flex items-start justify-between gap-4">
                                    <div>
                                        <div className="text-xs font-extrabold tracking-[0.18em] text-primary uppercase mb-2">ĐĂNG KÝ DỊCH VỤ</div>
                                        <h3 className="text-2xl font-extrabold text-dark">Để lại thông tin</h3>
                                        <p className="text-sm text-slate-500 mt-1">Tao sẽ liên hệ lại để trao đổi chi tiết về nhu cầu của mày.</p>
                                    </div>
                                    <button type="button" onClick={close} className="w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center text-xl">×</button>
                                </div>
                                <div className="px-7 py-5 bg-slate-50 border-b border-slate-100">
                                    <div className="text-xs text-slate-400 font-bold uppercase tracking-wider">Gói đang chọn</div>
                                    <div className="mt-1 font-extrabold text-dark">{selected.platform} · {selected.packageName}</div>
                                    <div className="text-primary font-extrabold mt-0.5">{selected.price}</div>
                                </div>
                                <form onSubmit={handleSubmit} className="p-7 space-y-4">
                                    <div><label className="block text-sm font-bold text-slate-700 mb-1.5">Họ và tên <span className="text-red-500">*</span></label><input name="fullName" required placeholder="Nguyễn Văn A" className="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" /></div>
                                    <div><label className="block text-sm font-bold text-slate-700 mb-1.5">Doanh nghiệp / Thương hiệu</label><input name="company" placeholder="Tên công ty / thương hiệu" className="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" /></div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div><label className="block text-sm font-bold text-slate-700 mb-1.5">Số điện thoại <span className="text-red-500">*</span></label><input name="phone" required type="tel" placeholder="0909 608 377" className="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" /></div>
                                        <div><label className="block text-sm font-bold text-slate-700 mb-1.5">Email <span className="text-red-500">*</span></label><input name="email" required type="email" placeholder="email@company.com" className="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" /></div>
                                    </div>
                                    {error && <div className="rounded-xl bg-red-50 border border-red-100 text-red-600 text-sm p-3 leading-relaxed">{error}</div>}
                                    <button disabled={submitting} type="submit" className="w-full py-4 rounded-xl bg-primary text-white font-extrabold hover:bg-blue-700 disabled:opacity-60 disabled:cursor-not-allowed transition-colors">{submitting ? "Đang gửi thông tin..." : "Gửi thông tin đăng ký →"}</button>
                                    <p className="text-[11px] text-slate-400 text-center">Thông tin được gửi qua webhook và lưu vào hệ thống dữ liệu của bạn.</p>
                                </form>
                            </>
                        ) : (
                            <div className="p-10 text-center">
                                <div className="mx-auto w-16 h-16 rounded-full bg-green-50 text-green-600 flex items-center justify-center mb-5"><svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"/></svg></div>
                                <h3 className="text-2xl font-extrabold text-dark">Đăng ký thành công!</h3>
                                <p className="text-slate-500 mt-2 leading-relaxed">Thông tin của bạn đã được gửi. Cảm ơn bạn đã quan tâm đến dịch vụ.</p>
                                <button type="button" onClick={close} className="mt-7 px-7 py-3 rounded-xl bg-slate-900 text-white font-bold hover:bg-slate-800">Đóng</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const Footer = () => (
            <footer className="py-12 px-6 max-w-4xl mx-auto text-center">
                <div className="bg-orange-50 rounded-3xl p-8 border border-orange-100 shadow-sm">
                    <div className="flex items-center justify-center gap-2 text-vocab font-bold mb-3">
                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                        </svg>
                        <span>Lưu ý quan trọng</span>
                    </div>
                    <p className="text-slate-600 text-sm md:text-base leading-relaxed">
                        Giá trên là phí triển khai content & quản lý nội dung remote. Các hạng mục như: <span className="font-semibold text-dark">quay phim trực tiếp, người mẫu/KOL, ngân sách quảng cáo, chi phí đi lại, thiết kế chuyên sâu hoặc yêu cầu sản xuất đặc biệt</span> có thể được báo giá riêng tùy theo yêu cầu cụ thể của từng dự án.
                    </p>
                </div>
                <p className="mt-10 text-slate-400 text-sm">
                    &copy; {new Date().getFullYear()} Doan Quoc Anh. All rights reserved.
                </p>
            </footer>
        );

        const App = () => {
            return (
                <div className="min-h-screen relative overflow-hidden">
                    {/* Background decorations */}
                    <div className="fixed top-0 left-0 w-full h-full overflow-hidden -z-20 pointer-events-none">
                        <div className="absolute top-[20%] left-[-10%] w-[500px] h-[500px] bg-blue-100/40 rounded-full blur-[120px]"></div>
                        <div className="absolute bottom-[-10%] right-[-5%] w-[600px] h-[600px] bg-orange-100/40 rounded-full blur-[120px]"></div>
                    </div>

                    <Header />
                    
                    <main>
                        <PricingSection data={platformsData.facebook_instagram} />
                        
                        <div className="h-10"></div> {/* Spacer */}
                        
                        <PricingSection data={platformsData.youtube_tiktok} />
                        
                        <PricingSection data={platformsData.website} />
                        
                        <ScopeOfWork />
                    </main>

                    <Footer />
                    <LeadModal />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
